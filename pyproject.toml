[project]
name = "quantum-transpile-audit"
version = "0.1.0"
description = "A pre-flight audit tool for quantum circuits that intercepts QIR, checks live hardware calibration data for degraded qubits, and optimizes routing before execution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.27.0",
    "qiskit>=2.5.1",
    "qiskit-ibm-runtime>=0.48.0",
    "rich>=15.0.0",
    "rustworkx>=0.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.extra-build-dependencies]
ibm-platform-services = ["setuptools", "pkg_resources"]
